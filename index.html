<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sadiq Adil — Master Hub</title>
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Sadiq Adil: Official digital hub and social ecosystem.">
    
    <!-- خطوط أبل وأنظمة التنسيق -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #000000;
            --surface-glass: rgba(255, 255, 255, 0.035);
            --surface-hover: rgba(255, 255, 255, 0.075);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.22);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent-blue: #0a84ff;
            --accent-purple: #bf5af2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html {
            background: var(--bg-deep);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 16px 80px;
        }

        /* شريط التمرير العلوي التقدمي (Progress Bar) */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #0a84ff, #bf5af2, #ff375f);
            width: 0%;
            z-index: 100;
            transition: width 0.1s ease-out;
        }

        /* إضاءة خلفية سينمائية متحركة (Ambient Glow) */
        .ambient-mesh {
            position: fixed;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 500px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.12) 0%, rgba(191, 90, 242, 0.08) 45%, transparent 75%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        .wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
        }

        /* تأثيرات الانبثاق الاحترافية (Scroll Reveal Animations) */
        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* شريط التحكم العلوي */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            backdrop-filter: blur(25px);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 10px #30d158;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .share-btn {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(25px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .share-btn:active {
            transform: scale(0.95);
            background: var(--surface-hover);
        }

        /* بطاقة الهوية الرئيسية الفخمة (Hero Card) */
        .hero-card {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 36px;
            padding: 44px 24px;
            text-align: center;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
            overflow: hidden;
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
            padding: 3px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hero-card:hover .avatar {
            transform: scale(1.05);
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.6px;
        }

        .verified-icon {
            width: 20px;
            height: 20px;
            color: var(--accent-blue);
        }

        .handle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .bio {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        /* شبكة الروابط الفخمة (Bento Grid) */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .bento-card {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .bento-card.full-width {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            min-height: 100px;
            padding: 22px 28px;
        }

        .bento-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.6s;
        }

        .bento-card:hover::before {
            left: 100%;
        }

        .bento-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-glow);
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
        }

        .bento-card:active {
            transform: scale(0.97);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .icon-wrapper svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        .external-arrow {
            color: var(--text-muted);
            font-size: 16px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .bento-card:hover .external-arrow {
            transform: translate(3px, -3px);
            color: var(--text-main);
        }

        .card-content {
            margin-top: 18px;
        }

        .bento-card.full-width .card-content {
            margin-top: 0;
            margin-left: 18px;
            flex: 1;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ألوان ناضجة وراقية للمصادر */
        .color-tg { color: #38bdf8; }
        .color-yt { color: #f87171; }
        .color-ig { color: #f472b6; }
        .color-kick { color: #4ade80; }

        /* تذييلة الصفحة */
        .footer-credit {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* إشعار منبثق عند نسخ الرابط (Toast) */
        .toast-popup {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 26px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
