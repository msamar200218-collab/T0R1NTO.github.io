<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadiq Adil | Master Hub</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.25);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-blue: #0a84ff;
            --accent-purple: #bf5af2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 80px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية إضاءة أبل السينمائية المتحركة */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 500px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.15) 0%, rgba(191, 90, 242, 0.08) 45%, transparent 75%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* تأثيرات الانبثاق والظهور عند التمرير (Scroll Reveal) */
        .reveal-item {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-item.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* شريط الحالة العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            backdrop-filter: blur(20px);
        }

        .pulse {
            width: 7px;
            height: 7px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 10px #30d158;
            animation: pulseAnim 2s infinite;
        }

        @keyframes pulseAnim {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .share-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .share-btn:active {
            transform: scale(0.95);
            background: var(--surface-hover);
        }

        /* بطاقة الهوية الكبرى (Hero Section) */
        .hero-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 48px 24px;
            text-align: center;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .avatar-container {
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        .verified {
            width: 20px;
            height: 20px;
            color: var(--accent-blue);
        }

        .handle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .bio {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 420px;
            margin: 0 auto;
        }

        /* شبكة الروابط الاحترافية (Bento Grid) */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .bento-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        /* بطاقة عريضة تأخذ سطر كامل */
        .bento-card.full {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            min-height: 100px;
            padding: 22px 28px;
        }

        .bento-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-glow);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .bento-card:active {
            transform: scale(0.97);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .arrow {
            color: var(--text-secondary);
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .bento-card:hover .arrow {
            transform: translate(3px, -3px);
            color: var(--text-primary);
        }

        .card-details {
            margin-top: 18px;
        }

        .bento-card.full .card-details {
            margin-top: 0;
            margin-left: 18px;
            flex: 1;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ألوان تميز المنصات */
        .c-tg { color: #38bdf8; }
        .c-yt { color: #f87171; }
        .c-ig { color: #f472b6; }
        .c-kick { color: #4ade80; }

        /* تذييلة الصفحة */
        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        /* نافذة الإشعار السريع (Toast) */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
