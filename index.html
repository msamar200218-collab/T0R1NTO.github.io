const arrow='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* build stages */
const host=$("#stages"),dots=$("#dots");
APPS.forEach((a,i)=>{
  const s=document.createElement("section");s.className="stage";s.id=a.k;
  s.style.setProperty("--c",a.c);s.style.setProperty("--g",a.g);if(a.f)s.style.setProperty("--f",a.f);if(a.bt)s.style.setProperty("--bt",a.bt);
  const ico=`<svg viewBox="0 0 24 24">${P[a.ic]}</svg>`;
  let sp="";for(let j=0;j<6;j++)sp+=`<div class="sp" data-j="${j}">${ico}</div>`;
  s.innerHTML=`<div class="pin"><div class="glow"></div><div class="ring"></div><div class="ring"></div>${sp}
  <div class="win"><div class="num">${String(i+1).padStart(2,"0")} / ${String(APPS.length).padStart(2,"0")}</div>
  <div class="ico">${ico}</div><div class="nm">${a.n}</div><p class="ds"></p>
  <a class="go" href="${a.web(CFG[a.k])}" data-k="${a.k}"><span></span>${arrow}</a></div></div>`;
  host.appendChild(s);
  const d=document.createElement("i");d.onclick=()=>s.scrollIntoView({behavior:"smooth"});dots.appendChild(d);
});
const dl=$("#dl");
dl.innerHTML='<a class="mi" href="#hero" data-s="-1" style="--n:0"><span class="mic h"><img data-logo alt=""></span><span data-i="home">Home</span></a>'+APPS.map((a,i)=>`<a class="mi" href="#${a.k}" data-s="${i}" style="--n:${i+1};--c:${a.c};--g:${a.g};--f:${a.f||"#fff"}"><span class="mic"><svg viewBox="0 0 24 24">${P[a.ic]}</svg></span><span>${a.n}</span></a>`).join("");

/* deep links */
host.addEventListener("click",e=>{

    if(!o.vis){o.vis=true;o.el.classList.add("vis")}
    const t=ez(cl(1-top/(vh*.75))),p=cl(-top/(o.h-vh)),ex=cl((p-.82)/.18),k=1-t,sg=i%2?1:-1;
    if(top<vh*.5&&p<1)a2=i;
    set(o.win,0,k*140-ex*60,.82+.18*t-ex*.06,k*-6,t*(1-ex));
    set(o.ico,sg*k*300*R,k*-160,.3+.7*t,k*sg*90,cl(t*1.4));
    set(o.num,0,k*-60,1,0,cl(t*1.6-.3));
    set(o.nm,-sg*k*340*R,k*40,.7+.3*t,0,cl(t*1.5-.2));
    set(o.ds,0,k*120,1,0,cl(t*1.6-.4));
    set(o.go,0,k*200,.6+.4*t,0,cl(t*1.8-.6));
    o.glow.style.opacity=(.5*t*(1-ex)).toFixed(3);
    o.rings.forEach((g,n)=>{g.style.transform=`scale(${(1+k*1.4).toFixed(3)})`;g.style.opacity=(.35*t*(1-t*.6)*(1-ex)).toFixed(3)});
    o.sp.forEach((e,n)=>{const d=(300+n%2*80)*R*(k*1.6+1),an=ang[n]+k*2;
      e.style.left="50%";e.style.top="50%";e.style.margin="-23px 0 0 -23px";
      e.style.transform=`translate3d(${(Math.cos(an)*d).toFixed(1)}px,${(Math.sin(an)*d*.8).toFixed(1)}px,0) scale(${(t*.9*(1-ex)).toFixed(3)}) rotate(${(k*200).toFixed(0)}deg)`;e.style.opacity=(t*.5).toFixed(3)});
    o.ico.classList.toggle("live",t>.98&&ex<.2);
  });
  if(a2!==act){act=a2;S.forEach((o,i)=>{o.el.classList.toggle("act",i===act);o.dot.classList.toggle("on",i===act)});
    [...dl.children].forEach((e,n)=>e.classList.toggle("on",n===act+1));
    if(act>=0)document.documentElement.style.setProperty("--c",APPS[act].c)}
}
