<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torinto | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية ضوئية متحركة بطابع أبل الخيالي */
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(41, 151, 255, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            top: -120px;
            left: -120px;
            z-index: -1;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -120px;
            right: -120px;
            z-index: -1;
            animation: pulseGlow 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding: 20px;
            z-index: 1;
            animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* قسم البروفايل مع شالة الحالة */
        .profile-section {
            margin-bottom: 35px;
        }

            height: 120px;
            margin: 0 auto 22px;
        }
