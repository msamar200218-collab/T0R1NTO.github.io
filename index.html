<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORINTO | Master Hub</title>
    <style>
        :root {
            --bg-color: #030305;
            --card-bg: rgba(255, 255, 255, 0.035);
            --card-hover: rgba(255, 255, 255, 0.075);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.22);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent-blue: #0a84ff;
            --accent-purple: #bf5af2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 50px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية الإضاءة السينمائية المتحركة */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 450px;
            background: radial-gradient(circle at 50% 0%, rgba(10, 132, 255, 0.15) 0%, rgba(191, 90, 242, 0.1) 40%, transparent 75%);
            filter: blur(70px);
            z-index: -1;
            pointer-events: none;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* شريط العلوي وأزرار التحكم */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            backdrop-filter: blur(20px);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 10px #30d158;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(20px);
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .action-btn:active {
            transform: scale(0.95);
            background: var(--card-hover);
        }

        /* بطاقة الهوية الرئيسية (Hero Section) */
        .hero-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 36px 20px;
            text-align: center;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
            overflow: hidden;
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover {
            transform: scale(1.06);
        }

        .name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .verified-badge {
            width: 18px;
            height: 18px;
            color: var(--accent-blue);
        }

        .handle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto;
        }

        /* شبكة الروابط الفخمة (Bento Grid Layout) */
        .grid-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .bento-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .bento-card.full-width {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            min-height: 84px;
            padding: 16px 20px;
        }

        .bento-card:hover {
            background: var(--card-hover);
            border-color: var(--border-glow);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .bento-card:active {
            transform: scale(0.97);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .icon-box svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 15px;
            transition: transform 0.25s ease;
        }

        .bento-card:hover .arrow-icon {
            transform: translate(-3px, -3px);
            color: var(--text-main);
        }

        .card-details {
            margin-top: 14px;
        }

        .bento-card.full-width .card-details {
            margin-top: 0;
            margin-right: 14px;
            flex: 1;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* تخصيص ألوان الأيقونات لكل منصة */
        .color-tg { color: #38bdf8; }
        .color-yt { color: #f87171; }
        .color-ig { color: #f472b6; }
        .color-kick { color: #4ade80; }

        /* تذييلة الصفحة الفخمة */
        .footer-credit {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        /* نافذة الإشعار السريع عند نسخ الرابط */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
