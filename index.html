<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>T0R1NTO — Official Ecosystem</title>
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html {
            background: var(--bg-color);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* شريط أبل العلوي السينمائي */
        nav.apple-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 10000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 15px;
        }

        .nav-logo-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255, 59, 48, 0.6));
        }

        .nav-status {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 6px #30d158;
        }

        /* أقسام العرض السينمائي */
        .hero-section {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            background-color: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* النافذة المنبثقة الزجاجية */
        .popup-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 50px 30px;
            max-width: 520px;
            width: 100%;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(60px) scale(0.95);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* أول قسم يظهر فوراً بدون الحاجة للتمرير */
        .hero-section.first-hero .popup-card,
        .hero-section.visible .popup-card {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .platform-icon-box {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .platform-icon-box svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .platform-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .platform-title {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .platform-desc {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto 28px;
            line-height: 1.5;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #f5f5f7;
            color: #000000;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255,255,255,0.15);
        }

        .cta-button:hover {
            transform: scale(1.05);
            background-color: #ffffff;
            box-shadow: 0 15px 35px rgba(255,255,255,0.25);
        }

        /* ألوان الأيقونات */
        .color-yt { color: #f87171; }
        .color-tg { color: #38bdf8; }
        .color-wa { color: #4ade80; }
        .color-ig { color: #f472b6; }
        .color-tt { color: #ffffff; }
        .color-sc { color: #facc15; }
        .color-tw { color: #38bdf8; }
        .color-kick { color: #4ade80; }

        footer.site-footer {
            background-color: #000000;
            color: var(--text-secondary);
            padding: 40px 20px;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 768px) {
            .popup-card { padding: 35px 20px; }
            .platform-title { font-size: 30px; }
        }
    </style>
</head>
