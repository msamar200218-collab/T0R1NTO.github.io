<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORINTO | Exclusive Space</title>
    <style>
        /* نظام أبل للتصميم والألوان النظيفة */
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-glow: rgba(138, 43, 226, 0.25);
            --accent-glow-2: rgba(0, 113, 227, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 24px 16px;
        }

        /* خلفية ديناميكية متحركة تفاعلية (طراز أبل الراقي) */
        .ambient-light {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.7;
        }

        .blob {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            animation: floatBlob 12s infinite alternate ease-in-out;
        }

        .blob:nth-child(2) {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            bottom: -50px;
            right: -50px;
            animation-duration: 15s;
            animation-direction: alternate-reverse;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }

        /* الحاوية الرئيسية (Glassmorphism فائق الدقة) */
        .wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 40px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* حاوية الصورة الشخصية مع إطار ضوئي فاخر */
        .avatar-container {
            position: relative.svg;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* النصوص والأسماء */
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 500;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        p.bio {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        /* قائمة الروابط الاحترافية */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        /* تأثير لمعة أبل عند مرور الماوس أو اللمس */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: 0.5s;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .link-card:active {
            transform: scale(0.97);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 20px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .arrow-icon {
            color: var(--text-secondary);
            font-size: 14px;
            transition: transform 0.2s ease;
        }

.link-card:hover .arrow-icon {
            transform: translateX(-4px);
            color: #fff;
        }

        /* الفوتر السفلي الأنيق */
        .footer {
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- الإضاءة الخلفية الديناميكية على طريقة أبل -->
    <div class="ambient-light">
        <div class="blob" style="top: -50px; left: -50px;"></div>
        <div class="blob"></div>
    </div>

    <div class="wrapper">
        <!-- الصورة الشخصية -->
        <div class="avatar-container">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" alt="Profile Image" class="avatar">
        </div>

        <h1>TORINTO</h1>
        <div class="badge">Creator & Visual Designer</div>
        <p class="bio">مرحباً بك في مساحتي الرقمية الخاصة. استكشف منصاتي ومحتواها الحصري أدناه.</p>

        <!-- الأزرار والروابط -->
        <div class="links-stack">
            <a href="https://t.me/" target="_blank" class="link-card">
                <div class="link-content">
                    <span class="link-icon">💬</span>
                    <span>قناة التيليجرام الرسمية</span>
                </div>
                <span class="arrow-icon">←</span>
            </a>

            <a href="https://youtube.com/" target="_blank" class="link-card">
                <div class="link-content">
                    <span class="link-icon">▶</span>
                    <span>قناة اليوتيوب (TORINTO)</span>
                </div>
                <span class="arrow-icon">←</span>
            </a>

            <a href="https://instagram.com/" target="_blank" class="link-card">
                <div class="link-content">
                    <span class="link-icon">📸</span>
                    <span>حساب الإنستغرام</span>
                </div>
                <span class="arrow-icon">←</span>
            </a>

            <a href="https://t.me/" target="_blank" class="link-card">
                <div class="link-content">
                    <span class="link-icon">🌐</span>
                    <span>المجتمع الخاص بي</span>
                </div>
                <span class="arrow-icon">←</span>
            </a>
        </div>

        <div class="footer">
            © 2026 TORINTO. All Rights Reserved.
        </div>
    </div>

</body>
</html>
