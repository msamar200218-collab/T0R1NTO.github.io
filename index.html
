<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORINTO</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 50% -20%, #1c1c1e 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, #0a0a0c 0%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 410px;
            text-align: center;
            animation: appleEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes appleEntrance {
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
        }

        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg, #161618 0%, #08080a 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 34px; 
            font-weight: 700; 
            letter-spacing: 1px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
            color: #f5f5f7;
        }

        .avatar-box::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff3b30, #0a84ff, #5e5ce6, #ff3b30);
            background-size: 300% 300%;
            z-index: 1;
            opacity: 0.35;
            filter: blur(14px);
            animation: appleGlow 8s ease infinite;
        }

        @keyframes appleGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #f5f5f7;
        }

        p.bio {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 36px;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 18px 22px;
            margin-bottom: 16px;
            border-radius: 18px;
            background: rgba(28, 28, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f5f5f7;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .link-btn:hover, .link-btn:active {
            transform: scale(0.98);
            background: rgba(44, 44, 46, 0.85);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .link-btn:hover::before {
            opacity: 1;
        }

        .link-btn.yt { border-right: 4px solid #ff453a; }
        .link-btn.tg { border-right: 4px solid #0a84ff; }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            font-size: 18px;
        }

        .arrow { 
            color: #86868b; 
            font-size: 12px; 
            transition: transform 0.3s ease; 
        }

        .link-btn:hover .arrow { 
            transform: translateX(-4px); 
            color: #ffffff; 
        }

        .footer {
            margin-top: 48px;
            font-size: 11px;
            color: #48484a;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="avatar-box">
        <div class="logo">T</div>
    </div>
    <h1>TORINTO</h1>
    <p class="bio">المحتوى الرسمي — اختر منصتك المفضلة</p>

    <a class="link-btn yt" onclick="go('yt')">
        <div class="btn-content">
            <span class="btn-icon">▶</span>
            <span>قناتي على يوتيوب (YouTube)</span>
        </div>
        <span class="arrow">◀</span>
    </a>

    <a class="link-btn tg" onclick="go('tg')">
        <div class="btn-content">
            <span class="btn-icon">✈</span>
            <span>قناتي على تيليجرام (Telegram)</span>
        </div>
        <span class="arrow">◀</span>
    </a>

    <div class="footer">TORINTO © 2026</div>
</div>
