<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORINTO</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 50% -20%, #1c1c1e 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, #0a0a0c 0%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 410px;
            text-align: center;
            animation: appleEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes appleEntrance {
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
        }

        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg, #161618 0%, #08080a 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 34px; 
            font-weight: 700; 
            letter-spacing: 1px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
            color: #f5f5f7;
        }
